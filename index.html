<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ned's Wellness" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <base href="https://truckeeman.github.io/ned-wellness/" />
  <meta name="theme-color" content="#4A7C6F" />
  <title>Ned's Wellness Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --border: #E5E0D8;
      --accent: #4A7C6F; --accent-light: #EAF2F0; --accent-text: #2D5C52;
      --ned: #4A7C6F; --ned-light: #EAF2F0;
      --text: #1A1A1A; --text-sec: #6B6560; --text-ter: #9E9890;
      --red: #C0392B; --red-light: #FDEDEC;
      --green: #27AE60; --green-light: #EAFAF1;
      --warn: #C8833A; --warn-light: #FDF3E7;
      --gold: #B8860B; --gold-light: #FDF8E1;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); font-size: 16px; }
    #app { height: 100%; display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(12px + var(--safe-top)) 18px 0; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-date { font-size: 13px; color: var(--text-ter); }
    .tabs { display: flex; }
    .tab { flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; color: var(--text-sec); cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .tab.active { color: var(--ned); border-color: var(--ned); }
    .content { flex: 1; overflow-y: auto; padding: 16px 16px calc(24px + var(--safe-bottom)); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card-ned { border-left: 3px solid var(--ned); }
    .card-warn { border-left: 3px solid var(--warn); }
    .card-green { border-left: 3px solid var(--green); }
    .card-gold { border-left: 3px solid var(--gold); }
    .card h3 { font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .label { font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
    .label-opt { font-size: 11px; font-weight: 400; color: var(--text-ter); text-transform: none; }
    input[type=text], input[type=number], input[type=date], textarea, select {
      font-family: inherit; font-size: 15px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 100%; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); background: var(--surface); }
    textarea { resize: vertical; min-height: 72px; }
    .scale { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .scale-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 500; color: var(--text-sec); cursor: pointer; transition: all 0.12s; }
    .scale-btn.active { background: var(--ned); border-color: var(--ned); color: #fff; font-weight: 600; }
    .scale-hint { font-size: 13px; color: var(--text-sec); align-self: center; margin-left: 4px; }
    .mood-row { display: flex; gap: 8px; margin-top: 6px; }
    .mood-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; cursor: pointer; transition: all 0.12s; }
    .mood-btn.active { border-color: var(--accent); background: var(--accent-light); }
    .btn-primary { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: var(--ned); border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-top: 4px; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .btn-secondary { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--ned); background: var(--ned-light); border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; }
    .btn-warn { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--warn); background: var(--warn-light); border: 1px solid var(--warn); border-radius: 8px; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .ex-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .ex-row:last-child { border-bottom: none; }
    .ex-chk { width: 24px; height: 24px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--bg); cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.12s; }
    .ex-chk.done { background: var(--ned); border-color: var(--ned); color: #fff; }
    .ex-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .ex-sets { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
    .ex-tip { font-size: 12px; color: var(--text-ter); margin-top: 3px; font-style: italic; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .metric-label { font-size: 11px; color: var(--text-ter); margin-bottom: 4px; }
    .metric-val { font-size: 20px; font-weight: 600; color: var(--ned); }
    .nav-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .nav-btn { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text-sec); cursor: pointer; }
    .nav-center { flex: 1; text-align: center; font-size: 13px; color: var(--text-sec); }
    .prog-wrap { background: var(--border); border-radius: 4px; height: 5px; margin-bottom: 14px; overflow: hidden; }
    .prog-bar { height: 5px; border-radius: 4px; background: var(--ned); transition: width 0.3s; }
    .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
    .banner-warn { background: var(--warn-light); border: 1px solid #e8a96a; color: #7a4e1a; }
    .banner-rest { background: var(--accent-light); border: 1px solid #b2d4ce; color: var(--accent-text); }
    .banner-green { background: var(--green-light); border: 1px solid #82d9a8; color: #1a6b3c; }
    .banner-gold { background: var(--gold-light); border: 1px solid #d4b800; color: #6b5000; }
    .banner-red { background: var(--red-light); border: 1px solid #e8a0a0; color: #6b1a1a; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
    .loc-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .loc-btn { flex: 1; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text-sec); cursor: pointer; }
    .loc-btn.sel { background: var(--ned-light); border-color: var(--ned); color: var(--ned); font-weight: 600; }
    .day-pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
    .day-pill { padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 14px; cursor: pointer; }
    .day-pill.sel { background: var(--ned); border-color: var(--ned); color: #fff; }
    .setup-intro { font-size: 14px; color: var(--text-sec); margin-bottom: 16px; line-height: 1.5; }
    .cardio-mins { display: flex; align-items: center; gap: 8px; padding: 6px 0 6px 36px; }
    .cardio-mins input { max-width: 70px; }
    .cardio-mins label { font-size: 13px; color: var(--text-sec); }
    .reset-link { text-align: center; font-size: 12px; color: var(--text-ter); cursor: pointer; margin-top: 20px; padding: 8px; }
    .autosave-indicator { text-align: center; font-size: 12px; color: var(--text-ter); margin-top: 8px; transition: color 0.2s; }
    .autosave-indicator.saved { color: var(--green); }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-sec); }
    .stat-val { text-align: right; font-weight: 500; }
    .mini-item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .mini-item:last-child { border-bottom: none; }
    .mini-date { color: var(--text-ter); flex-shrink: 0; width: 44px; }
    .note-item { padding: 8px 0; border-bottom: 1px solid var(--border); border-left: 3px solid var(--ned); padding-left: 10px; margin-bottom: 4px; }
    .note-item:last-child { border-bottom: none; }
    .note-meta { font-size: 11px; color: var(--text-ter); margin-bottom: 3px; }
    .note-text { font-size: 14px; }
    /* Milestone gate styles */
    .milestone-gate { background: var(--gold-light); border: 1px solid #d4b800; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .milestone-gate h3 { color: var(--gold); margin-bottom: 10px; }
    .milestone-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e8d870; font-size: 14px; }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-check { font-size: 18px; }
    .milestone-label { flex: 1; padding: 0 10px; color: var(--text); }
    .milestone-status { font-size: 12px; color: var(--text-sec); }
    /* Frequency guardrail */
    .freq-bar-wrap { background: var(--border); border-radius: 4px; height: 8px; margin: 8px 0 4px; overflow: hidden; }
    .freq-bar { height: 8px; border-radius: 4px; transition: width 0.3s; }
    /* HIT log button */
    .hit-log-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: #fff; background: #8B5E3C; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 8px; }
    /* RHR/VO2 input row */
    .vitals-row { display: flex; gap: 12px; }
    .vitals-row .field { flex: 1; }
    .empty { text-align: center; padding: 40px 20px; }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 14px; color: var(--text-sec); }
  </style>
</head>

// ── Storage ───────────────────────────────────────────────────

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v) { try { localStorage.setItem(k,v); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

function getConfig() { const r=lsGet('ned_config'); return r?JSON.parse(r):null; }
function saveConfig(cfg) { lsSet('ned_config',JSON.stringify(cfg)); }
function getEntry(date) { const r=lsGet('ned_entry_'+date); return r?JSON.parse(r):{}; }
function saveEntry(date,data) {
  lsSet('ned_entry_'+date,JSON.stringify(data));
  const r=lsGet('ned_dates'); const dates=r?JSON.parse(r):[];
  if(!dates.includes(date)){dates.push(date);dates.sort();lsSet('ned_dates',JSON.stringify(dates));}
}
function getRecentDates(n=7) { const r=lsGet('ned_dates'); return r?JSON.parse(r).slice(-n).reverse():[]; }
function getExDone(date) { const r=lsGet('ned_ex_'+date); return r?JSON.parse(r):[]; }
function saveExDone(date,done) { lsSet('ned_ex_'+date,JSON.stringify(done)); }
function getCardioMins(date,id) { const r=lsGet('ned_cardio_'+date); const d=r?JSON.parse(r):{}; return d[id]||''; }
function saveCardioMins(date,id,mins) { const r=lsGet('ned_cardio_'+date); const d=r?JSON.parse(r):{}; if(mins)d[id]=mins; else delete d[id]; lsSet('ned_cardio_'+date,JSON.stringify(d)); }
function getAllCardioMins(date) { const r=lsGet('ned_cardio_'+date); return r?JSON.parse(r):{}; }
function getSkipOverride(date) { const r=lsGet('ned_skip_'+date); return r?JSON.parse(r):null; }
function setSkipOverride(date,val) { if(val)lsSet('ned_skip_'+date,JSON.stringify(val)); else lsDel('ned_skip_'+date); }

// ── Milestone / Progress Storage ──────────────────────────────

function getProgress() {
  const r=lsGet('ned_progress');
  return r?JSON.parse(r):{
    phase: 1,
    bwSessionsPhase1: 0,
    bwSessionsPhase2: 0,
    bwSessionsPhase3: 0,
    milestones: {},  // gate id → { passed: true, loggedAt, value }
    rhrLog: [],      // [{date, value}]
    vo2Log: [],      // [{date, value}]
  };
}
function saveProgress(p) { lsSet('ned_progress',JSON.stringify(p)); }

function getBwSessionCount(phase) {
  const p=getProgress();
  if(phase===1) return p.bwSessionsPhase1||0;
  if(phase===2) return p.bwSessionsPhase2||0;
  return p.bwSessionsPhase3||0;
}

function incrementBwSession(phase) {
  const p=getProgress();
  if(phase===1) p.bwSessionsPhase1=(p.bwSessionsPhase1||0)+1;
  else if(phase===2) p.bwSessionsPhase2=(p.bwSessionsPhase2||0)+1;
  else p.bwSessionsPhase3=(p.bwSessionsPhase3||0)+1;
  saveProgress(p);
}

// ── HIT Logging ───────────────────────────────────────────────

function logHIT(date) {
  const r=lsGet('ned_hit_dates'); const hits=r?JSON.parse(r):[];
  if(!hits.includes(date)){hits.push(date);hits.sort();lsSet('ned_hit_dates',JSON.stringify(hits));}
}
function wasHITDay(date) { const r=lsGet('ned_hit_dates'); return r?JSON.parse(r).includes(date):false; }
function isDayAfterHIT(date) {
  const d=new Date(date+'T12:00:00'); d.setDate(d.getDate()-1);
  const prev=d.toISOString().slice(0,10);
  return wasHITDay(prev);
}

// ── Frequency Guardrail ───────────────────────────────────────

function getBwSessionsLast14Days() {
  const today=new Date(); const count={sessions:0,dates:[]};
  for(let i=0;i<14;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const done=getExDone(ds);
    const hasBW=done.some(id=>id.startsWith('bw')||id.startsWith('mod'));
    if(hasBW){count.sessions++;count.dates.push(ds);}
  }
  return count;
}

// ── Helpers ───────────────────────────────────────────────────

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { const dt=new Date(d+'T12:00:00'); return `${WEEKDAYS[dt.getDay()]} ${MONTHS[dt.getMonth()]} ${dt.getDate()}`; }
function addDays(dateStr,n) { const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function avg(arr,key) { const vals=arr.map(e=>e[key]).filter(v=>v&&v>0); return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—'; }

function pickVariation(options,dateStr) {
  const seed=dateStr.split('-').reduce((a,p)=>a+parseInt(p),0);
  return options[seed%options.length];
}
function getTodaysBW(phase,dateStr) { return BW[phase].map(slot=>pickVariation(slot.options,dateStr)); }

// ── State ─────────────────────────────────────────────────────

const state = { tab:'workout', viewDate:todayStr() };

// ── Render ────────────────────────────────────────────────────

function h(tag,attrs={},...children){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')el.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  }
  for(const c of children.flat(Infinity)){
    if(c==null||c===false)continue;
    el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);
  }
  return el;
}

function render() {
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(buildApp());
}

function buildApp() {
  const wrap=h('div',{style:{height:'100%',display:'flex',flexDirection:'column'}});
  wrap.appendChild(buildHeader());
  const content=h('div',{class:'content'});
  if(state.tab==='workout') content.appendChild(buildWorkout());
  else if(state.tab==='log') content.appendChild(buildLog());
  else if(state.tab==='progress') content.appendChild(buildProgress());
  else if(state.tab==='week') content.appendChild(buildWeek());
  wrap.appendChild(content);
  return wrap;
}

function buildHeader() {

  wrap.appendChild(h('div',{class:'reset-link',onClick:()=>{if(confirm('Reset program setup?')){lsDel('ned_config');render();}}},'Reset program setup'));

function buildProgress() {
  const prog=getProgress();
  const phase=prog.phase||1;
  const wrap=h('div',{});

  // Phase summary
  const phaseCard=h('div',{class:'card card-ned'});
  phaseCard.appendChild(h('h3',{},`Current: ${PHASE_NAMES[phase]}`));
  phaseCard.appendChild(h('div',{style:{fontSize:'14px',color:'var(--text-sec)',marginBottom:'12px'}},'Progress advances when you hit all milestone gates — not by calendar.'));

  const sessLabel=phase===1?'Phase 1 sessions':phase===2?'Phase 2 sessions':'Phase 3 sessions';
  const sessCount=getBwSessionCount(phase);
  phaseCard.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'14px',marginBottom:'8px'}},
    h('span',{},sessLabel), h('span',{style:{fontWeight:'600',color:'var(--ned)'}},`${sessCount} completed`)
  ));
  wrap.appendChild(phaseCard);

  // Milestone gate for current phase transition
  const gateKey=phase<3?(phase===1?'1to2':'2to3'):null;
  if(gateKey) {
    const gateDef=MILESTONES[gateKey];
    const milestones=prog.milestones||{};
    const gateCard=h('div',{class:'milestone-gate'});
    gateCard.appendChild(h('h3',{},`🎯 ${gateDef.label}`));
    gateCard.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-sec)',marginBottom:'12px'}},'Check off each gate when you\'ve demonstrated it. All four must pass to advance.'));

    let allPassed=true;
    for(const gate of gateDef.gates){
      const passed=gate.computed
        ? (gate.id==='sessions_10'&&sessCount>=10)
        : !!(milestones[gate.id]&&milestones[gate.id].passed);
      if(!passed)allPassed=false;
      const row=h('div',{class:'milestone-row'});
      row.appendChild(h('span',{class:'milestone-check'},passed?'✅':'⬜'));
      row.appendChild(h('span',{class:'milestone-label'},gate.label));
      if(!gate.computed&&!passed){
        const checkBtn=h('button',{class:'btn-secondary',style:{fontSize:'12px',padding:'4px 10px'},onClick:()=>{
          const val=gate.field==='rhr_trend'||gate.field==='vo2_trend'
            ? prompt('Confirm trend: enter "stable" or "improving"')
            : prompt(`Enter your result (e.g. "${gate.field==='pushups'?'8 reps':'20 sec'}")`);
          if(!val)return;
          const p=getProgress();
          p.milestones=p.milestones||{};
          p.milestones[gate.id]={passed:true,value:val,loggedAt:new Date().toISOString()};
          saveProgress(p);render();
        }},'Log result');
        row.appendChild(checkBtn);
      } else if(!gate.computed&&passed){
        row.appendChild(h('span',{class:'milestone-status'},milestones[gate.id]?.value||''));
      } else if(gate.computed){
        row.appendChild(h('span',{class:'milestone-status'},`${sessCount}/10`));
      }
      gateCard.appendChild(row);
    }

    if(allPassed&&phase<3){
      const advanceBtn=h('button',{class:'btn-primary',style:{marginTop:'14px'},onClick:()=>{
        if(confirm(`Advance to Phase ${phase+1}? This can\'t be undone.`)){
          const p=getProgress();
          p.phase=(p.phase||1)+1;
          p.milestones={};
          saveProgress(p);render();
        }
      }},`🚀 Advance to Phase ${phase+1}`);
      gateCard.appendChild(advanceBtn);
    }
    wrap.appendChild(gateCard);
  } else {
    wrap.appendChild(h('div',{class:'banner banner-gold'},'🏆 You\'ve completed all three phases. This is maintenance territory — keep logging and stay consistent.'));
  }

  // RHR trend
  const rhrLog=(prog.rhrLog||[]).slice(-8);
  if(rhrLog.length) {
    const rhrCard=h('div',{class:'card'});
    rhrCard.appendChild(h('h3',{},'Resting Heart Rate Log'));
    for(const entry of rhrLog.reverse()){
      const row=h('div',{class:'mini-item'});
      row.appendChild(h('span',{class:'mini-date'},fmtDate(entry.date).slice(0,6)));
      row.appendChild(h('span',{style:{color:'var(--ned)',fontWeight:'500'}},`${entry.value} bpm`));
      rhrCard.appendChild(row);
    }
    wrap.appendChild(rhrCard);
  }

  // VO2 trend
  const vo2Log=(prog.vo2Log||[]).slice(-8);
  if(vo2Log.length) {
    const vo2Card=h('div',{class:'card'});
    vo2Card.appendChild(h('h3',{},'VO2 Max Log'));
    for(const entry of vo2Log.reverse()){
      const row=h('div',{class:'mini-item'});
      row.appendChild(h('span',{class:'mini-date'},fmtDate(entry.date).slice(0,6)));
      row.appendChild(h('span',{style:{color:'var(--ned)',fontWeight:'500'}},`${entry.value} mL/kg/min`));
      vo2Card.appendChild(row);
    }
    wrap.appendChild(vo2Card);
  }

  // Manually reset milestone (escape hatch)
  const resetMs=h('div',{class:'reset-link',onClick:()=>{
    if(confirm('Reset all milestone checks (not your session count or phase)?')){
      const p=getProgress();p.milestones={};saveProgress(p);render();
    }
  }},'Reset milestone checks');
  wrap.appendChild(resetMs);

  return wrap;
}

// ── Week Tab ──────────────────────────────────────────────────

function buildWeek() {
  const wrap=h('div',{});
  wrap.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-sec)',marginBottom:'14px'}},'Last 7 days — averages and highlights'));

  // Export/Import
  const dataCard=h('div',{class:'card'});
  dataCard.appendChild(h('h3',{},'Backup your data'));
  const dataBtnRow=h('div',{style:{display:'flex',gap:'8px'}});
  dataBtnRow.appendChild(h('button',{class:'nav-btn',style:{flex:'1'},onClick:exportAllData},'Export (.json)'));
  const importInput=h('input',{type:'file',accept:'.json',style:{display:'none'}});
  const importBtn=h('button',{class:'nav-btn',style:{flex:'1'},onClick:()=>importInput.click()},'Import (.json)');
  importInput.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file)return;
    if(!confirm('Import will overwrite matching entries. Continue?'))return;
    importAllData(file,(ok,count)=>{
      if(ok){alert(`Imported ${count} items.`);render();}
      else alert('Could not read file.');
    });
  });
  dataBtnRow.appendChild(importBtn);
  dataCard.appendChild(dataBtnRow);dataCard.appendChild(importInput);
  wrap.appendChild(dataCard);

  const dates=getRecentDates(7);
  const entries=dates.map(d=>({...getEntry(d),date:d})).filter(e=>Object.keys(e).length>1);

  if(!entries.length){
    wrap.appendChild(h('div',{class:'empty'},h('div',{class:'empty-icon'},'📋'),h('div',{class:'empty-title'},'No entries yet'),h('div',{class:'empty-sub'},'Switch to Daily Log to get started.')));
    return wrap;
  }

  // Stats
  const statsCard=h('div',{class:'card'});
  const stats=[
    {label:'Avg sleep',fn:es=>{const vals=es.map(e=>e.sleepMinutes).filter(v=>v!=null&&v>0);if(!vals.length)return'—';const a=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);return Math.floor(a/60)+'h '+(a%60)+'m';}},
    {label:'Sleep quality',fn:es=>{const a=avg(es,'sleepQuality');return a==='—'?a:a+'/5';}},
    {label:'Avg energy',fn:es=>{const a=avg(es,'energy');return a==='—'?a:a+'/10';}},
    {label:'Avg mood',fn:es=>{const a=avg(es,'mood');return a==='—'?a:a+'/5';}},
    {label:'Avg RHR',fn:es=>{const a=avg(es,'rhr');return a==='—'?a:a+' bpm';}},
    {label:'Days logged',fn:es=>String(es.length)},
  ];
  for(const s of stats){
    const row=h('div',{class:'stat-row'});
    row.appendChild(h('div',{class:'stat-label'},s.label));
    const v=s.fn(entries);
    row.appendChild(h('div',{class:'stat-val',style:{color:'var(--ned)'}},v==='—'?h('span',{style:{color:'var(--text-ter)'}},v):v));
    statsCard.appendChild(row);
  }
  wrap.appendChild(statsCard);

  // Movement
  const moveCard=h('div',{class:'card'});
  moveCard.appendChild(h('h3',{},'Movement this week'));
  const hitDates=(lsGet('ned_hit_dates')?JSON.parse(lsGet('ned_hit_dates')):[]).filter(d=>dates.includes(d));
  if(hitDates.length) {
    for(const d of hitDates){
      const row=h('div',{class:'mini-item'});
      row.appendChild(h('span',{class:'mini-date'},fmtDate(d).slice(0,6)));
      row.appendChild(h('span',{style:{color:'#8B5E3C',fontWeight:'500'}},'⚡ HIT'));
      moveCard.appendChild(row);
    }
  }
  const exItems=entries.filter(e=>{const d=getExDone(e.date);return d.some(id=>id.startsWith('bw')||id.startsWith('mod'));});
  if(!exItems.length&&!hitDates.length){moveCard.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-ter)'}},'None logged'));}
  else for(const e of exItems){
    const d=getExDone(e.date);
    const bwCount=d.filter(id=>id.startsWith('bw')||id.startsWith('mod')).length;
    const hasCardio=d.some(id=>id.startsWith('c'));
    const row=h('div',{class:'mini-item'});
    row.appendChild(h('span',{class:'mini-date'},fmtDate(e.date).slice(0,6)));
    row.appendChild(h('span',{style:{color:'var(--ned)'}},`Bodyweight (${bwCount} ex)${hasCardio?' + Cardio':''}`));
    moveCard.appendChild(row);
  }
  wrap.appendChild(moveCard);

  // Pain notes
  const painItems=entries.filter(e=>e.pain);
  if(painItems.length){
    const painCard=h('div',{class:'card'});
    painCard.appendChild(h('h3',{},'Pain notes'));
    for(const e of painItems){
      const row=h('div',{class:'mini-item'});
      row.appendChild(h('span',{class:'mini-date'},fmtDate(e.date).slice(0,6)));
      row.appendChild(h('span',{style:{color:'var(--warn)'}},e.pain));
      painCard.appendChild(row);
    }
    wrap.appendChild(painCard);
  }

  // Food
  const foodItems=entries.filter(e=>e.food);
  if(foodItems.length){
    const foodCard=h('div',{class:'card'});
    foodCard.appendChild(h('h3',{},'Food this week'));
    for(const e of foodItems){
      const item=h('div',{class:'note-item'});
      item.appendChild(h('div',{class:'note-meta'},fmtDate(e.date)));
      item.appendChild(h('div',{class:'note-text'},e.food));
      foodCard.appendChild(item);
    }
    wrap.appendChild(foodCard);
  }

  // Notes
  const noteItems=entries.filter(e=>e.notes);
  if(noteItems.length){
    const notesCard=h('div',{class:'card'});
    notesCard.appendChild(h('h3',{},'Notes this week'));
    for(const e of noteItems){
      const item=h('div',{class:'note-item'});
      item.appendChild(h('div',{class:'note-meta'},fmtDate(e.date)));
      item.appendChild(h('div',{class:'note-text'},e.notes));
      notesCard.appendChild(item);
    }
    wrap.appendChild(notesCard);
  }

  return wrap;
}

// ── Export / Import ───────────────────────────────────────────

function exportAllData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='wellness-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importAllData(file,onDone){
  const reader=new FileReader();
  reader.onload=e=>{
    try{const parsed=JSON.parse(e.target.result);const data=parsed.data||parsed;let count=0;
      for(const[k,v]of Object.entries(data)){localStorage.setItem(k,v);count++;}onDone(true,count);
    }catch{onDone(false,0);}
  };
  reader.readAsText(file);
}

// ── Boot ──────────────────────────────────────────────────────
render();
</script>
