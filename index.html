<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ned's Wellness" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <base href="https://truckeeman.github.io/ned-wellness/" />
  <meta name="theme-color" content="#4A7C6F" />
  <title>Ned's Wellness Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <style>
    :root {
      --bg: #F7F5F0;
      --surface: #FFFFFF;
      --border: #E5E0D8;
      --accent: #4A7C6F;
      --accent-light: #EAF2F0;
      --accent-text: #2D5C52;
      --ned: #4A7C6F;
      --ned-light: #EAF2F0;
      --judi: #8B5E8A;
      --judi-light: #F5EFF5;
      --text: #1A1A1A;
      --text-sec: #6B6560;
      --text-ter: #9E9890;
      --red: #C0392B;
      --red-light: #FDEDEC;
      --green: #27AE60;
      --green-light: #EAFAF1;
      --warn: #C8833A;
      --warn-light: #FDF3E7;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); font-size: 16px; }
    #app { height: 100%; display: flex; flex-direction: column; max-width: 680px; margin: 0 auto; }

    /* Header */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(12px + var(--safe-top)) 18px 0; position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-date { font-size: 13px; color: var(--text-ter); }
    .tabs { display: flex; }
    .tab { flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; color: var(--text-sec); cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .tab.active-ned { color: var(--ned); border-color: var(--ned); }
    .tab.active-judi { color: var(--judi); border-color: var(--judi); }
    .tab.active-week { color: var(--accent); border-color: var(--accent); }
    .tab.active-ex-ned { color: var(--ned); border-color: var(--ned); }
    .tab.active-ex-judi { color: var(--judi); border-color: var(--judi); }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 16px 16px calc(24px + var(--safe-bottom)); }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .card-accent-ned { border-left: 3px solid var(--ned); }
    .card-accent-judi { border-left: 3px solid var(--judi); }
    .card-accent-warn { border-left: 3px solid var(--warn); }
    .card-accent-green { border-left: 3px solid var(--green); }
    .card h3 { font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }

    /* Form elements */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .label { font-size: 12px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
    .label-opt { font-size: 11px; font-weight: 400; color: var(--text-ter); text-transform: none; letter-spacing: 0; }
    input[type=text], input[type=number], input[type=date], textarea, select {
      font-family: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 100%; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); background: var(--surface); }
    textarea { resize: vertical; min-height: 72px; }

    /* Scale picker */
    .scale { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .scale-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; font-weight: 500; color: var(--text-sec); cursor: pointer; transition: all 0.12s; }
    .scale-btn.active-ned { background: var(--ned); border-color: var(--ned); color: #fff; font-weight: 600; }
    .scale-btn.active-judi { background: var(--judi); border-color: var(--judi); color: #fff; font-weight: 600; }
    .scale-hint { font-size: 13px; color: var(--text-sec); align-self: center; margin-left: 4px; }

    /* Mood */
    .mood-row { display: flex; gap: 8px; margin-top: 6px; }
    .mood-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 22px; cursor: pointer; transition: all 0.12s; }
    .mood-btn.active { border-color: var(--accent); background: var(--accent-light); }

    /* Buttons */
    .btn-primary { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-top: 4px; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .btn-saved { background: var(--green) !important; }

    /* Exercise checklist */
    .ex-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .ex-row:last-child { border-bottom: none; }
    .ex-chk { width: 24px; height: 24px; border-radius: 5px; border: 1.5px solid var(--border); background: var(--bg); cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.12s; }
    .ex-chk.done-ned { background: var(--ned); border-color: var(--ned); color: #fff; }
    .ex-chk.done-judi { background: var(--judi); border-color: var(--judi); color: #fff; }
    .ex-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .ex-sets { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
    .ex-tip { font-size: 12px; color: var(--text-ter); margin-top: 3px; font-style: italic; }

    /* Metrics grid */
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .metric-label { font-size: 11px; color: var(--text-ter); margin-bottom: 4px; }
    .metric-val { font-size: 22px; font-weight: 600; }

    /* Nav */
    .nav-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .nav-btn { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text-sec); cursor: pointer; }
    .nav-center { flex: 1; text-align: center; font-size: 13px; color: var(--text-sec); }

    /* Progress bar */
    .prog-wrap { background: var(--border); border-radius: 4px; height: 5px; margin-bottom: 14px; overflow: hidden; }
    .prog-bar { height: 5px; border-radius: 4px; transition: width 0.3s; }

    /* Warning / info banners */
    .banner { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
    .banner-warn { background: var(--warn-light); color: var(--warn); border: 1px solid #f0c090; }
    .banner-rest { background: var(--bg); color: var(--text-sec); border: 1px solid var(--border); }
    .banner-green { background: var(--green-light); color: var(--green); border: 1px solid #a9dfbf; }

    /* Week summary table */
    .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 13px; color: var(--text-sec); }
    .stat-val { text-align: center; font-size: 19px; font-weight: 600; }
    .stat-header { font-size: 13px; font-weight: 600; text-align: center; }
    .week-col-ned { color: var(--ned); }
    .week-col-judi { color: var(--judi); }

    /* Notes list */
    .note-item { border-left: 3px solid var(--border); padding-left: 10px; margin-bottom: 10px; }
    .note-meta { font-size: 12px; color: var(--text-ter); margin-bottom: 2px; }
    .note-text { font-size: 14px; }

    /* Mini list */
    .mini-item { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .mini-date { color: var(--text-ter); min-width: 36px; flex-shrink: 0; }

    /* Empty state */
    .empty { text-align: center; padding: 40px 20px; color: var(--text-sec); }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .empty-sub { font-size: 14px; line-height: 1.5; }

    /* Two col grid */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

    /* Section subhead */
    .section-label { font-size: 11px; font-weight: 600; color: var(--text-ter); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; }

    /* Setup */
    .setup-intro { font-size: 15px; color: var(--text-sec); line-height: 1.6; margin-bottom: 18px; }
    .day-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .day-pill { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; color: var(--text); cursor: pointer; transition: all 0.12s; }
    .day-pill.sel { background: var(--red-light); color: var(--red); border-color: var(--red); }
    .loc-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .loc-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; color: var(--text); cursor: pointer; }
    .loc-btn.sel { background: var(--accent-light); color: var(--accent-text); border-color: var(--accent); }

    /* Footer reset */
    .reset-link { text-align: center; font-size: 12px; color: var(--text-ter); margin-top: 20px; cursor: pointer; }
    .cardio-mins { display: flex; align-items: center; gap: 6px; margin-top: 6px; margin-left: 36px; }
    .cardio-mins input { width: 64px; font-size: 14px; padding: 6px 8px; }
    .cardio-mins label { font-size: 13px; color: var(--text-ter); }
    .autosave-indicator { text-align: center; font-size: 12px; color: var(--text-ter); margin-top: 14px; padding-bottom: 8px; min-height: 20px; transition: color 0.3s; }
    .autosave-indicator.saved { color: var(--green); }
    .sleep-time-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .sleep-time-row input[type=number] { width: 70px; flex: none; }
    .sleep-time-row select { flex: none; width: 110px; }
    .sleep-time-label { font-size: 13px; color: var(--text-sec); }
  </style>
</head>
<body>
<div id="app"></div>
<script>

// ── Data ──────────────────────────────────────────────────────

// Each slot is an array of 2-3 equivalent-difficulty variations.
// A date-seeded picker rotates through them day to day.
const BW = {
  1: [
    { slot:'squat', options:[
      {id:'bw0a',name:'Bodyweight squat',sets:'2 × 10',tip:'Sit back into hips — you have the range, use comfortable depth'},
      {id:'bw0b',name:'Chair-assisted split squat',sets:'2 × 8 each side',tip:'Back foot light touch on chair behind you, front leg does the work'},
      {id:'bw0c',name:'Wall sit hold',sets:'2 × 20–30 sec',tip:'Back flat against wall, thighs toward parallel — static squat strength'}
    ]},
    { slot:'hinge', options:[
      {id:'bw1a',name:'Hip hinge',sets:'2 × 12',tip:'Soft knee bend, hinge at hip, feel hamstrings load'},
      {id:'bw1b',name:'Good morning (bodyweight)',sets:'2 × 10',tip:'Hands behind head, hinge forward keeping back flat'}
    ]},
    { slot:'push', options:[
      {id:'bw2a',name:'Incline push-up',sets:'2 × 8–12',tip:'Hands on counter or bench, full range'},
      {id:'bw2b',name:'Wall push-up',sets:'2 × 12–15',tip:'Steeper angle, easier on shoulders — good variety day'}
    ]},
    { slot:'core', options:[
      {id:'bw3a',name:'Dead bug',sets:'2 × 6 each side',tip:'Slow and controlled, low back stays flat'},
      {id:'bw3b',name:'Standing bird dog reach',sets:'2 × 8 each side',tip:'Standing version — opposite arm/leg reach, hold 2 sec'}
    ]},
    { slot:'balance', options:[
      {id:'bw4a',name:'Single-leg balance',sets:'2 × 20 sec each',tip:'Eyes open first, progress to eyes closed'},
      {id:'bw4b',name:'Heel-to-toe stand',sets:'2 × 20 sec each side lead',tip:'One foot directly in front of the other, hold'}
    ]}
  ],
  2: [
    { slot:'squat', options:[
      {id:'bw0a',name:'Goblet squat',sets:'2 × 12',tip:'Light weight or water jug, sit back into depth'},
      {id:'bw0b',name:'Split squat',sets:'2 × 10 each side',tip:'Rear foot elevated slightly if comfortable, front leg drives'},
      {id:'bw0c',name:'Step-back lunge',sets:'2 × 10 each side',tip:'Step back rather than forward — easier on the front knee'}
    ]},
    { slot:'hinge', options:[
      {id:'bw1a',name:'Single-leg Romanian deadlift',sets:'2 × 8 each side',tip:'Bodyweight first, add load as confidence builds'},
      {id:'bw1b',name:'Romanian deadlift (light dumbbells)',sets:'2 × 12',tip:'Both legs, light load, focus on the hip hinge pattern'}
    ]},
    { slot:'push', options:[
      {id:'bw2a',name:'Floor push-up',sets:'3 × 10–15',tip:'Working toward 20-rep ceiling with full control'},
      {id:'bw2b',name:'Staggered-hand push-up',sets:'3 × 8–12 each side lead',tip:'One hand slightly forward — adds variety without more load'}
    ]},
    { slot:'core', options:[
      {id:'bw3a',name:'Bird dog',sets:'2 × 8 each side',tip:'Contralateral reach, slow tempo, full extension'},
      {id:'bw3b',name:'Side plank (knee-supported)',sets:'2 × 15–20 sec each side',tip:'Knees bent for support, straight line shoulder to knee'}
    ]},
    { slot:'glute', options:[
      {id:'bw4a',name:'Glute bridge',sets:'2 × 15',tip:'Drive hips up fully, squeeze at top for 1 sec'},
      {id:'bw4b',name:'Single-leg glute bridge',sets:'2 × 10 each side',tip:'One foot planted, other leg extended — more challenge, same pattern'}
    ]},
    { slot:'balance', options:[
      {id:'bw5a',name:'Single-leg balance',sets:'2 × 30 sec each',tip:'Eyes closed, add small arm movements for challenge'},
      {id:'bw5b',name:'Single-leg reach (toe touch)',sets:'2 × 8 each side',tip:'Standing on one leg, reach opposite hand toward floor and back up'}
    ]}
  ],
  3: [
    { slot:'squat', options:[
      {id:'bw0a',name:'Tempo goblet squat',sets:'3 × 10',tip:'3 sec down, 1 sec up — same weight feels much harder'},
      {id:'bw0b',name:'Tempo split squat',sets:'3 × 8 each side',tip:'3 sec down, 1 sec up, same split stance as Phase 2'},
      {id:'bw0c',name:'Jump-free squat pulse',sets:'3 × 12',tip:'Bottom-of-squat pulses, stay low, no jumping — knee-friendly intensity'}
    ]},
    { slot:'hinge', options:[
      {id:'bw1a',name:'Tempo single-leg RDL',sets:'3 × 8 each',tip:'3 sec lower, 1 sec return — add light dumbbell if available'},
      {id:'bw1b',name:'Tempo Romanian deadlift',sets:'3 × 10',tip:'Both legs, 3 sec lower, controlled return, moderate load'}
    ]},
    { slot:'push', options:[
      {id:'bw2a',name:'Push-up',sets:'3 × 15–20',tip:'Full control throughout — quality over quantity'},
      {id:'bw2b',name:'Tempo push-up',sets:'3 × 10–12',tip:'3 sec down, explode up (controlled) — same reps, more demand'}
    ]},
    { slot:'core', options:[
      {id:'bw3a',name:'Bird dog with hold',sets:'3 × 6 each',tip:'Hold extended position 3 sec each rep'},
      {id:'bw3b',name:'Side plank with reach',sets:'3 × 10 each side',tip:'From side plank, thread top arm under and rotate — anti-rotation challenge'}
    ]},
    { slot:'glute', options:[
      {id:'bw4a',name:'Glute bridge march',sets:'2 × 10 each',tip:'Hold bridge, alternate lifting knees'},
      {id:'bw4b',name:'Single-leg glute bridge (tempo)',sets:'2 × 8 each side',tip:'3 sec lower phase, same single-leg pattern as Phase 2'}
    ]},
    { slot:'step', options:[
      {id:'bw5a',name:'Step-up slow eccentric',sets:'2 × 10 each',tip:'3 sec lower on descent — gym step or stairs'},
      {id:'bw5b',name:'Lateral step-up',sets:'2 × 10 each side',tip:'Step up sideways onto a low step — different knee-tracking angle'}
    ]}
  ]
};

// Deterministic day-seeded picker so the same calendar date always shows
// the same exercise (keeps checkmarks consistent if you navigate back/forth)
function pickVariation(options, dateStr) {
  const seed = dateStr.split('-').reduce((a,p)=>a+parseInt(p),0);
  return options[seed % options.length];
}

function getTodaysBW(phase, dateStr) {
  return BW[phase].map(slot => pickVariation(slot.options, dateStr));
}

const CARDIO = {
  truckee: {
    1:{opts:['Zone 2 walk (35–40 min)','Stationary bike Zone 2 (35–40 min)'],hr:'115–125 bpm',note:'Conversational pace. Altitude pushes HR faster — slow down if you can\'t talk easily.'},
    2:{opts:['Zone 2 walk (45–55 min)','Stationary bike Zone 2 (45–55 min)','Hike (60–75 min, moderate terrain)'],hr:'115–130 bpm',note:'Add 2 min per session per week. One longer hike if energy is good.'},
    3:{opts:['Zone 2 walk or bike (45–50 min)','Zone 3 fartlek (45 min with 3–4 × 3 min pushes)'],hr:'115–135 bpm',note:'One session per week becomes Zone 3 — moderate push for 3 min, not a sprint.'}
  },
  la: {
    1:{opts:['Elliptical Zone 2 (35–40 min)','Gym bike Zone 2 (35–40 min)','Treadmill incline walk (35–40 min)'],hr:'115–125 bpm',note:'Elliptical is ideal — lowest impact, no eccentric load.'},
    2:{opts:['Elliptical Zone 2 (45–55 min)','Gym bike Zone 2 (45–55 min)','Treadmill incline walk (50–60 min)'],hr:'115–130 bpm',note:'Coming down from Truckee you\'ll feel stronger — good time to push duration.'},
    3:{opts:['Elliptical with 3–4 × 3 min Zone 3 pushes (45 min)','Gym bike fartlek (45 min)','Add dumbbell/cable work (15 min) on gym days'],hr:'115–135 bpm',note:'LA gym access opens cable and dumbbell options in Phase 3.'}
  }
};

const PHASE_NAMES = ['','Phase 1 — Establish the pattern','Phase 2 — Build duration & load','Phase 3 — Intensity variation'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const FULLDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ENERGY_LABELS = ['','Very low','Low','Below avg','Average','Good','Strong','Great','Very strong','Excellent','Peak'];
const SLEEP_LABELS = ['','1h','2h','3h','4h','5h','6h','7h','8h','9h','10h+'];
const SLEEP_Q_LABELS = ['','Poor','Fair','Decent','Good','Great'];
const MOOD_EMOJIS = ['','😔','😕','😐','🙂','😊'];

// ── Storage ───────────────────────────────────────────────────

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k,v) { try { localStorage.setItem(k,v); return true; } catch { return false; } }

function getConfig(user) {
  const raw = lsGet(`${user}_config`);
  return raw ? JSON.parse(raw) : null;
}
function saveConfig(user, cfg) { lsSet(`${user}_config`, JSON.stringify(cfg)); }

function getEntry(user, date) {
  const raw = lsGet(`${user}_entry_${date}`);
  return raw ? JSON.parse(raw) : {};
}
function saveEntry(user, date, data) {
  lsSet(`${user}_entry_${date}`, JSON.stringify(data));
  const datesRaw = lsGet(`${user}_dates`);
  const dates = datesRaw ? JSON.parse(datesRaw) : [];
  if (!dates.includes(date)) { dates.push(date); dates.sort(); lsSet(`${user}_dates`, JSON.stringify(dates)); }
}
function getRecentDates(user, n=7) {
  const raw = lsGet(`${user}_dates`);
  const all = raw ? JSON.parse(raw) : [];
  return all.slice(-n).reverse();
}
function getExDone(user, date) {
  const raw = lsGet(`${user}_ex_${date}`);
  return raw ? JSON.parse(raw) : [];
}
function saveExDone(user, date, done) { lsSet(`${user}_ex_${date}`, JSON.stringify(done)); }

// ── Cardio minutes storage ───────────────────────────────────
function getCardioMins(user, date, id) {
  const raw = lsGet(user + '_cardio_' + date);
  const data = raw ? JSON.parse(raw) : {};
  return data[id] || '';
}
function saveCardioMins(user, date, id, mins) {
  const raw = lsGet(user + '_cardio_' + date);
  const data = raw ? JSON.parse(raw) : {};
  if (mins) data[id] = mins; else delete data[id];
  lsSet(user + '_cardio_' + date, JSON.stringify(data));
}
function getAllCardioMins(user, date) {
  const raw = lsGet(user + '_cardio_' + date);
  return raw ? JSON.parse(raw) : {};
}

// ── Pain check + skip override ───────────────────────────────

function getTodayPainLevel(user) {
  const entry = getEntry(user, todayStr());
  // pain is currently free text; we look for a companion numeric field if present
  return entry.painLevel || null;
}

function getSkipOverride(user, date) {
  const raw = lsGet(user + '_skip_' + date);
  return raw ? JSON.parse(raw) : null;
}
function setSkipOverride(user, date, val) {
  if (val) lsSet(user + '_skip_' + date, JSON.stringify(val));
  else { try { localStorage.removeItem(user + '_skip_' + date); } catch(e) {} }
}

function painWarningBanner(user, date) {
  if (date !== todayStr()) return null;
  const entry = getEntry(user, date);
  if (!entry.pain) return null;
  // Free-text pain note exists — show a gentle, non-prescriptive nudge
  return h('div',{class:'banner banner-warn',style:{fontSize:'13px'}},
    '⚠️ You logged "' + entry.pain + '" today. Consider scaling back, skipping the bodyweight block, or using "Skip / modify today" below — your call.'
  );
}

function buildSkipControl(user, date) {
  const current = getSkipOverride(user, date);
  const wrap = h('div',{style:{marginTop:'14px',marginBottom:'6px'}});
  if (current) {
    const banner = h('div',{class:'banner banner-rest'});
    banner.appendChild(h('div',{},'✓ Today marked as: ' + (current.reason || 'Modified/skipped') ));
    const undoBtn = h('button',{class:'nav-btn',style:{marginTop:'8px'},onClick:()=>{
      setSkipOverride(user, date, null);
      render();
    }},'Undo — show normal workout');
    banner.appendChild(undoBtn);
    wrap.appendChild(banner);
  } else {
    const btn = h('button',{class:'nav-btn',style:{width:'100%'},onClick:()=>{
      const reason = prompt('Optional: note why you\'re skipping or modifying today (e.g. "hip pain", "low energy", "travel day"). Leave blank if you\'d rather not say.');
      if (reason === null) return; // cancelled
      setSkipOverride(user, date, { reason: reason || 'Skipped', loggedAt: new Date().toISOString() });
      render();
    }},'Skip / modify today');
    wrap.appendChild(btn);
  }
  return wrap;
}

// ── Helpers ───────────────────────────────────────────────────

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  const dt = new Date(d + 'T12:00:00');
  return `${WEEKDAYS[dt.getDay()]} ${MONTHS[dt.getMonth()]} ${dt.getDate()}`;
}
function getWeek(start, view) {
  const s = new Date(start + 'T00:00:00');
  const v = new Date(view + 'T00:00:00');
  return Math.min(Math.max(Math.floor((v-s)/(7*24*3600*1000))+1,1),12);
}
function getPhase(w) { return w<=4?1:w<=8?2:3; }
function isHIT(days, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return days.includes(d.getDay());
}
function isRecovery(days, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const prev = new Date(d); prev.setDate(prev.getDate()-1);
  return days.includes(prev.getDay());
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function avg(arr, key) {
  const vals = arr.map(e=>e[key]).filter(v=>v&&v>0);
  return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : '—';
}
function clamp(v,mn,mx) { return Math.min(Math.max(v,mn),mx); }

// ── Render engine ─────────────────────────────────────────────

function h(tag, attrs={}, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k==='class') el.className=v;
    else if (k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  }
  for (const c of children.flat(Infinity)) {
    if (c==null||c===false) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return el;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(buildApp());
}

}

// ── Workout → Log summary ─────────────────────────────────────

function buildWorkoutSummary(user) {
  const done = getExDone(user, todayStr());
  if (!done.length) return null;
  const cfg = getConfig(user);
  const parts = [];
  let estMins = 0;
  if (done.includes('pliability')) { parts.push('Pliability'); estMins += 18; }
  const phase = cfg ? getPhase(getWeek(cfg.startDate, todayStr())) : 1;
  const todaysBW = getTodaysBW(phase, todayStr());
  const bwDone = todaysBW.filter(e => done.includes(e.id));
  if (bwDone.length) { parts.push('Bodyweight block (' + bwDone.length + '/' + todaysBW.length + ' exercises)'); estMins += 12; }
  if (done.includes('rec-walk')) { parts.push('Gentle walk'); estMins += 20; }
  const cardioDone = done.filter(k => k.startsWith('c'));
  if (cardioDone.length && cfg) {
    const loc = cfg.location || 'truckee';
    const phase2 = getPhase(getWeek(cfg.startDate, todayStr()));
    const cd = CARDIO[loc][phase2];
    const cardioMinsData = getAllCardioMins('ned', todayStr());
    const cardioParts = [];
    let cardioTotal = 0;
    for (const cid of cardioDone) {
      const idx = parseInt(cid.slice(1));
      if (cd && cd.opts[idx]) {
        const label = cd.opts[idx].replace(/\s*\(.*?\)/g,'').trim();
        const mins = parseInt(cardioMinsData[cid]) || 0;
        cardioParts.push(label + (mins ? ' (' + mins + ' min)' : ''));
        if (mins) cardioTotal += mins;
        else {
          const m = cd.opts[idx].match(/(\d+)(?:\u2013(\d+))?\s*min/);
          if (m) cardioTotal += m[2] ? Math.round((parseInt(m[1])+parseInt(m[2]))/2) : parseInt(m[1]);
          else cardioTotal += 40;
        }
      }
    }
    if (cardioParts.length) { parts.push(cardioParts.join(' + ')); estMins += cardioTotal; }
  }
  return parts.length ? { summary: parts.join(' + '), estMins } : null;
}

    const e = getEntry(user,todayStr());

  painInput.addEventListener('input', e => autoSave('pain', e.target.value));

  sleepMinsInput.addEventListener('change', saveSleepMinutes);

function buildScaleField(label, value, onChange, max, labels, color, scaleClass) {
  const field = h('div',{class:'field'});
  field.appendChild(h('div',{class:'label'},label));
  const scale = h('div',{class:'scale'});
  for (let n=1;n<=max;n++) {
    const btn = h('button',{class:`scale-btn${value===n?' '+scaleClass:''}`,onClick:()=>onChange(value===n?0:n)},String(n));
    scale.appendChild(btn);
  }
  if (labels && value>0) scale.appendChild(h('span',{class:'scale-hint'},labels[value]));
  field.appendChild(scale);
  return field;
}

  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  const payload = { exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wellness-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importAllData(file, onDone) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const data = parsed.data || parsed;
      let count = 0;
      for (const [k, v] of Object.entries(data)) {
        localStorage.setItem(k, v);
        count++;
      }
      onDone(true, count);
    } catch (err) {
      onDone(false, 0);
    }
  };
  reader.readAsText(file);
}

function buildWeek() {
  const wrap = h('div',{});
  wrap.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-sec)',marginBottom:'14px'}},'Last 7 days — averages and highlights'));

  // Export / Import card
  const dataCard = h('div',{class:'card'});
  dataCard.appendChild(h('h3',{},'Backup your data'));
  dataCard.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-sec)',marginBottom:'10px'}},'Download a backup file, or restore from a previous one. Useful before switching devices or clearing browser data.'));
  const dataBtnRow = h('div',{style:{display:'flex',gap:'8px'}});
  const exportBtn = h('button',{class:'nav-btn',style:{flex:'1'},onClick:exportAllData},'Export data (.json)');
  const importInput = h('input',{type:'file',accept:'.json',style:{display:'none'}});
  const importBtn = h('button',{class:'nav-btn',style:{flex:'1'},onClick:()=>importInput.click()},'Import data (.json)');
  importInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('Importing will overwrite any existing entries with the same dates. Continue?')) return;
    importAllData(file, (success, count) => {
      if (success) { alert('Imported ' + count + ' items successfully.'); render(); }
      else { alert('Could not read that file. Please make sure it is a valid backup file.'); }
    });
  });
  dataBtnRow.appendChild(exportBtn);
  dataBtnRow.appendChild(importBtn);
  dataCard.appendChild(dataBtnRow);
  dataCard.appendChild(importInput);
  wrap.appendChild(dataCard);

  const nedDates = getRecentDates('ned',7);
  const nedEntries = nedDates.map(d=>({...getEntry('ned',d),date:d})).filter(e=>Object.keys(e).length>1);

  if (!nedEntries.length) {
    const empty = h('div',{class:'empty'});
    empty.appendChild(h('div',{class:'empty-icon'},'📋'));
    empty.appendChild(h('div',{class:'empty-title'},'No entries yet this week'));
    empty.appendChild(h('div',{class:'empty-sub'},'Switch to Daily Log and add today\'s entry to get started.'));
    wrap.appendChild(empty);
    return wrap;
  }

  // Stats table
  const statsCard = h('div',{class:'card'});
  const stats = [
    {label:'Avg sleep', fn:(entries)=>{
      const vals = entries.map(e=>e.sleepMinutes).filter(v=>v!=null&&v>0);
      if (!vals.length) return '—';
      const avgMin = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
      return Math.floor(avgMin/60)+'h '+(avgMin%60)+'m';
    }},
    {label:'Sleep quality', fn:(entries)=>{ const a=avg(entries,'sleepQuality'); return a==='—'?a:a+'/5'; }},
    {label:'Avg energy', fn:(entries)=>{ const a=avg(entries,'energy'); return a==='—'?a:a+'/10'; }},
    {label:'Avg mood', fn:(entries)=>{ const a=avg(entries,'mood'); return a==='—'?a:a+'/5'; }},
    {label:'Days logged', fn:(entries)=>String(entries.length)},
  ];
  for (const s of stats) {
    const row = h('div',{class:'stat-row',style:{gridTemplateColumns:'1fr 1fr'}});
    row.appendChild(h('div',{class:'stat-label'},s.label));
    const nv = s.fn(nedEntries);
    row.appendChild(h('div',{class:'stat-val week-col-ned',style:{textAlign:'right'}},nv==='—'?h('span',{style:{color:'var(--text-ter)'}},nv):nv));
    statsCard.appendChild(row);
  }
  wrap.appendChild(statsCard);

  // Movement
  const moveCard = h('div',{class:'card'});
  moveCard.appendChild(h('h3',{style:{color:'var(--ned)'}},'Movement this week'));
  const exItems = nedEntries.filter(e=>e.exercise);
  if (!exItems.length) { moveCard.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-ter)'}},'None logged')); }
  else for (const e of exItems) {
    const item = h('div',{class:'mini-item'});
    item.appendChild(h('span',{class:'mini-date'},fmtDate(e.date).slice(0,6)));
    item.appendChild(h('span',{style:{color:'var(--ned)',flex:'1'}},e.exercise+(e.exerciseDuration?` (${e.exerciseDuration}m)`:'')));
    moveCard.appendChild(item);
  }
  wrap.appendChild(moveCard);

  // Pain
  const painCard = h('div',{class:'card'});
  painCard.appendChild(h('h3',{style:{color:'var(--ned)'}},'Pain notes this week'));
  const pItems = nedEntries.filter(e=>e.pain);
  if (!pItems.length) { painCard.appendChild(h('div',{style:{fontSize:'13px',color:'var(--text-ter)'}},'None noted')); }
  else for (const e of pItems) {
    const item = h('div',{class:'mini-item'});
    item.appendChild(h('span',{class:'mini-date'},fmtDate(e.date).slice(0,6)));
    item.appendChild(h('span',{style:{color:'var(--ned)'}},e.pain));
    painCard.appendChild(item);
  }
  wrap.appendChild(painCard);

  // Food
  const foodItems = nedEntries.filter(e=>e.food);
  if (foodItems.length) {
    const foodCard = h('div',{class:'card'});
    foodCard.appendChild(h('h3',{},'Food this week'));
    for (const e of foodItems) {
      const item = h('div',{class:'note-item',style:{borderLeftColor:'var(--ned)'}});
      item.appendChild(h('div',{class:'note-meta'},fmtDate(e.date)));
      item.appendChild(h('div',{class:'note-text'},e.food));
      foodCard.appendChild(item);
    }
    wrap.appendChild(foodCard);
  }

  // Notes
  const noteItems = nedEntries.filter(e=>e.notes);
  if (noteItems.length) {
    const notesCard = h('div',{class:'card'});
    notesCard.appendChild(h('h3',{},'Notes this week'));
    for (const e of noteItems) {
      const item = h('div',{class:'note-item',style:{borderLeftColor:'var(--ned)'}});
      item.appendChild(h('div',{class:'note-meta'},fmtDate(e.date)));
      item.appendChild(h('div',{class:'note-text'},e.notes));
      notesCard.appendChild(item);
    }
    wrap.appendChild(notesCard);
  }

  return wrap;
}

// ── Boot ──────────────────────────────────────────────────────
render();
</script>
</body>
</html>
